spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flight_sql?useSSL=false&serverTimezone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/flight_nosql
      database: flight_nosql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false
  web:
    cors:
      allowed-origins: "http://localhost:3000"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true

server:
  port: 8080

jwt:
  secret: "a-very-strong-secret-key-with-at-least-256-bits-length"
  expiration: 86400000 # 24 hours in milliseconds

logging:
  level:
    org.springframework.data.mongodb.core: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
    com.flight: DEBUG
